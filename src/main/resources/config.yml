language: zh

hive-mind:
  enabled: true
  sensor-range: 40
  memory-duration: 0.25

zombie-ai:
  override:
    mode: full
  break-speed: 1.0
  break-speed-multiplier: 2.4
  build-speed: 1.0
  noise-threshold: 10
  terrain-modification-enabled: true
  targeting:
    scan-cooldown-ms: 260
    switch-score-delta: 0.22
    max-range: 52.0
    recognition-range: 28.0
    player-position-weight: 1.55
    noise-source-weight: 0.26
    switch-hysteresis: 0.24
    noise-switch-bias-distance: 10.0
    whitelist: []
    blacklist: []
  routing:
    replan-base-ticks: 5
    replan-distance-penalty: 0.18
    last-known-memory-ms: 9000
  beacon:
    force-radius: 50.0
    force-damage-per-second: 1.5
    combat-exempt-distance: 2.6
  async:
    max-plans-per-tick: 48
    plan-time-budget-ms: 3
  recovery:
    repath-cooldown-ms: 700
    stuck-warning-ticks: 35
    stuck-teleport-ticks: 110
  build-blocks:
    - COBBLESTONE
    - DIRT
    - OAK_PLANKS
    - NETHERRACK
  build-duration: 20

  cooperation:
    retreat-health-threshold: 0.35
    regroup-distance: 11.0
    ally-disadvantage-threshold: 2
    breach-support-cooldown-ms: 3000
    focus-fire-range: 18.0
    flank-sync-range: 14.0
    bodyguard-scan-range: 20.0
    encircle-range: 16.0
    encircle-replan-ms: 1100
    breach-arrive-radius: 3.6

  pathing:
    formation-slot-spacing: 1.6
    formation-replan-threshold: 1.2
    separation-weight: 0.6
    separation-range: 2.2

  builder:
    place-cooldown-ms: 620
    place-cooldown-ms-lv9: 170
    place-cooldown-ms-lv12: 130
    breach-request-after-ms: 3000
    max-build-fail-ticks: 90
    temporary-block-duration-ms: 120000
    temporary-block-decay-window-ms: 30000
    temporary-block-decay-particle-interval-ticks: 10
    temporary-block-persistence-enabled: true
    temporary-block-save-interval-ticks: 200
    place-particle-count: 16
    break-hit-effect-interval-ms: 180
    break-hit-particle-count: 8
    break-finish-particle-count: 26
  breaker:
    blacklist:
      - BEDROCK
      - BARRIER
      - END_PORTAL
      - END_PORTAL_FRAME
      - COMMAND_BLOCK
      - CHAIN_COMMAND_BLOCK
      - REPEATING_COMMAND_BLOCK
      - STRUCTURE_BLOCK
      - STRUCTURE_VOID
      - JIGSAW
      - BEACON
      - RESPAWN_ANCHOR
    whitelist: []

zombie-roles:
  miner: 0.1
  builder: 0.3
  archer: 0.1
  ender: 0.25
  nurse: 0.05
  rusher: 0.05
  suicide: 0.05

spawn:
  max-zombies-per-chunk: 14
  mspt-threshold: 45
  algorithm:
    enabled: true
    chunk-cooldown-ms: 320
    max-global-zombies: 720
    max-near-player: 96
    spawn-budget-per-player: 7
    max-y-diff: 18
    vertical-search-range: 8
    accept-chance: 1.0
    enforce-night-only: false

level:
  max: 12
  threat:
    xp-weight: 0.18
    survival-days-weight: 0.12
    armor-weight: 0.22
    weapon-weight: 0.44
    damage-weight: 0.26
    kdr-weight: 0.30
  encounter:
    self-weight: 0.60
    nearby-max-weight: 0.40
    nearby-avg-weight: 0.15
    nearby-radius: 64.0
  hysteresis:
    up-threshold: 0.72
    down-threshold: 0.45

breach:
  lease-ms: 4000
  role-caps:
    primary: 2
    support: 4
    bodyguard: 3
  assignment:
    primary-distance-bias: 0.85
    support-distance-bias: 1.0
    bodyguard-distance-bias: 1.1

phantom:
  max-per-player: 20
  spawn-radius: 50
  spawn-chance: 0.1
  explode-chance: 0.04
  break-block-chance: 0.3
  attack-effect-chance: 0.1


blood-moon:
  chance: 0.08
  multiplier: 1.65
  health-multiplier: 1.20

cleanup:
  zombie-drops:
    trigger-world-item-count: 450
    batch-per-tick: 64
