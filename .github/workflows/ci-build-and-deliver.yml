name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (compile + package)
        run: mvn -B -DskipTests package

      - name: Prepare single build asset
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH="$(ls -1 target/TooMuchZombies-*.jar | head -n 1)"
          cp "$JAR_PATH" target/TooMuchZombies-latest.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TooMuchZombies-build-${{ github.sha }}
          path: target/TooMuchZombies-latest.jar
          if-no-files-found: error
