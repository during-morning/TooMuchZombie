name: Cleanup Pull Requests

on:
  workflow_dispatch:
    inputs:
      keep_pr_number:
        description: "PR number to keep open (leave empty to keep latest updated open PR)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close duplicate PRs and keep one
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepInput = core.getInput('keep_pr_number')?.trim();

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            if (openPrs.length <= 1) {
              core.info(`Open PR count is ${openPrs.length}; nothing to close.`);
              return;
            }

            let keep;
            if (keepInput) {
              const keepNumber = Number.parseInt(keepInput, 10);
              if (!Number.isFinite(keepNumber)) {
                core.setFailed(`Invalid keep_pr_number: ${keepInput}`);
                return;
              }
              keep = openPrs.find(pr => pr.number === keepNumber);
              if (!keep) {
                core.setFailed(`PR #${keepNumber} is not open or not found.`);
                return;
              }
            } else {
              keep = [...openPrs].sort((a, b) => {
                const ad = new Date(a.updated_at).getTime();
                const bd = new Date(b.updated_at).getTime();
                return bd - ad;
              })[0];
            }

            core.info(`Keeping PR #${keep.number}: ${keep.title}`);

            const toClose = openPrs.filter(pr => pr.number !== keep.number);
            for (const pr of toClose) {
              core.info(`Closing PR #${pr.number}: ${pr.title}`);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: `Closing as duplicate to keep a single active PR. Tracking in #${keep.number}.`,
              });
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed',
              });
            }
